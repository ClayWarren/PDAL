[package]
name = "pdal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdal-rs"
path = "src/main.rs"

[dependencies]
pdal-capi = { path = "../pdal-capi" }
pdal-core = { path = "../pdal-core" }
pdal-filters = { path = "../pdal-filters" }
pdal-io = { path = "../pdal-io" }
pdal-kernels = { path = "../pdal-kernels" }
pdal-native = { path = "../pdal-native" }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
