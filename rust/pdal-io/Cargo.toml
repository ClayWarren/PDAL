[package]
name = "pdal-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-party readers and writers for the PDAL Rust port."

[dependencies]
byteorder = "1.5.0"
chrono = "0.4.44"
flate2 = "1.1.9"
las = { version = "0.9.11", features = ["laz"] }
las-crs = "1.0.0"
lzf-rust = "0.1.0"
pdal-core = { path = "../pdal-core" }
pdal-native = { path = "../pdal-native" }
roxmltree = "0.21.1"
serde_json = "1.0"
spz-crate = { package = "spz", version = "0.0.6" }
uuid = "1.23.1"
zstd = "0.13"

[dev-dependencies]
pdal-filters = { path = "../pdal-filters" }
tempfile = "3.27.0"
