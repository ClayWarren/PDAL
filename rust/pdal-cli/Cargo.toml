[package]
name = "pdal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdal-rs"
path = "src/main.rs"

[dependencies]
pdal-capi = { path = "../pdal-capi" }
pdal-kernels = { path = "../pdal-kernels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
