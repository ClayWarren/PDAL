[workspace]
channels = ["conda-forge"]
name = "pdal"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]
version = "2.8.2"

[feature.dev.dependencies]
libgdal-core = "*"
proj = ">=9.6"
proj-data = "*"
cmake = "*"
compilers = "*"
ninja = "*"
pkg-config = "*"
libpq = "*"
hdf5 = "*"
cpd = "*"
fgt = "*"
tiledb = "*"
draco = "*"
nitro = "*"
ceres-solver = "*"
python = "*"
libarrow = "*"
libparquet = "*"
rust = "*"
cargo-llvm-cov = "*"
clang-tools = ">=19.1.7,<23"
geotiff = ">=1.7.4,<2"

[feature.doc.dependencies]
jupyter-book = ">=1.0.3,<2"
sphinx-notfound-page = ">=1.0.4,<2"
sphinxcontrib-jquery = ">=4.1,<5"
breathe = ">=4.35.0,<5"
sphinx-inline-tabs = ">=2023.4.21,<2024"
doxygen = "*"
cmake = "*"
python-pdal = "*"

[feature.goldendoodle.dependencies]
jupyterlab = ">=4.3.1,<5"
pdal = ">=2.8.2,<3"
python-pdal = ">=3.4.5,<4"
numpy = ">=2.1.3,<3"
scipy = ">=1.14.1,<2"
pandas = ">=2.2.3,<3"
geopandas = ">=1.0.1,<2"
scikit-learn = ">=1.5.2,<2"
scikit-image = ">=0.24.0,<0.25"
rasterio = ">=1.4.3,<2"
shapely = ">=2.0.6,<3"
matplotlib = ">=3.9.3,<4"
tqdm = ">=4.67.1,<5"

[feature.dev.target.win-64.tasks]
configure = { cmd = [ "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", ".build",
    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DWITH_TESTS=ON",
    "-DCMAKE_VERBOSE_MAKEFILE=OFF",
    "-DCMAKE_LIBRARY_PATH:FILEPATH=$CONDA_PREFIX/Library/lib",
    "-DCMAKE_INCLUDE_PATH:FILEPATH=$CONDA_PREFIX/Library/include",
    "-DOPENSSL_ROOT_DIR=$CONDA_PREFIX/Library",
    "-DBUILD_PLUGIN_CPD=OFF",
    "-DBUILD_PLUGIN_ICEBRIDGE=ON",
    "-DBUILD_PLUGIN_HDF=ON",
    "-DBUILD_PLUGIN_ARROW=ON",
    "-DBUILD_PLUGIN_TILEDB=ON",
    "-DBUILD_PLUGIN_NITF=ON",
    "-DBUILD_PLUGIN_TRAJECTORY=ON",
    "-DBUILD_PLUGIN_PGPOINTCLOUD=ON",
    "-DBUILD_PLUGIN_DRACO=ON",
    "-DBUILD_PLUGIN_RIVLIB=OFF",
    "-DENABLE_CTEST=OFF",
    "-DWITH_LZMA=OFF",
    "-DHDF5_DIR:FILEPATH=$CONDA_PREFIX/Library/cmake",
    "-DWITH_ZLIB=ON",
    "-Dgtest_force_shared_crt=ON",
    "-DBUILD_PGPOINTCLOUD_TESTS=OFF",
    "-DCMAKE_CXX_FLAGS=/D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR" ] }

[feature.dev.target.linux.tasks]
configure = { cmd = [ "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", ".build",
    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DWITH_TESTS=ON",
    "-DCMAKE_VERBOSE_MAKEFILE=OFF",
    "-DCMAKE_LIBRARY_PATH:FILEPATH=$CONDA_PREFIX/Library/lib",
    "-DCMAKE_INCLUDE_PATH:FILEPATH=$CONDA_PREFIX/Library/include",
    "-DOPENSSL_ROOT_DIR=$CONDA_PREFIX/Library",
    "-DBUILD_PLUGIN_CPD=OFF",
    "-DBUILD_PLUGIN_ICEBRIDGE=ON",
    "-DBUILD_PLUGIN_HDF=ON",
    "-DBUILD_PLUGIN_ARROW=ON",
    "-DBUILD_PLUGIN_TILEDB=ON",
    "-DBUILD_PLUGIN_NITF=ON",
    "-DBUILD_PLUGIN_TRAJECTORY=ON",
    "-DBUILD_PLUGIN_PGPOINTCLOUD=ON",
    "-DBUILD_PLUGIN_DRACO=ON",
    "-DBUILD_PLUGIN_RIVLIB=OFF",
    "-DENABLE_CTEST=OFF",
    "-DWITH_LZMA=OFF",
    "-DHDF5_DIR:FILEPATH=$CONDA_PREFIX/Library/cmake",
    "-DWITH_ZLIB=ON",
    "-Dgtest_force_shared_crt=ON",
    "-DBUILD_PGPOINTCLOUD_TESTS=OFF" ] }

[feature.dev.target.osx.tasks]
configure = { cmd = [ "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", ".build",
    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
    "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX",
    "-DWITH_TESTS=ON",
    "-DCMAKE_VERBOSE_MAKEFILE=OFF",
    "-DCMAKE_LIBRARY_PATH:FILEPATH=$CONDA_PREFIX/Library/lib",
    "-DCMAKE_INCLUDE_PATH:FILEPATH=$CONDA_PREFIX/Library/include",
    "-DOPENSSL_ROOT_DIR=$CONDA_PREFIX/Library",
    "-DBUILD_PLUGIN_CPD=ON",
    "-DBUILD_PLUGIN_ICEBRIDGE=ON",
    "-DBUILD_PLUGIN_HDF=ON",
    "-DBUILD_PLUGIN_ARROW=ON",
    "-DBUILD_PLUGIN_TILEDB=ON",
    "-DBUILD_PLUGIN_NITF=ON",
    "-DBUILD_PLUGIN_TRAJECTORY=ON",
    "-DBUILD_PLUGIN_PGPOINTCLOUD=ON",
    "-DBUILD_PLUGIN_DRACO=ON",
    "-DENABLE_CTEST=OFF",
    "-DWITH_LZMA=OFF",
    "-DBUILD_PGPOINTCLOUD_TESTS=OFF" ] }


[feature.dev.tasks]
build = { cmd = "cd .build && ninja", depends-on = ["configure"] }
test = { cmd = "cd .build && ctest -VV --output-on-failure", depends-on = ["build"] }
install = { cmd = "cd .build && ninja install", depends-on = ["build"] }
rust-fmt = { cmd = "cargo fmt --manifest-path rust/Cargo.toml --all --check" }
rust-check = { cmd = "cargo check --manifest-path rust/Cargo.toml --workspace" }
rust-clippy = { cmd = "cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -W clippy::cognitive_complexity -D warnings -A clippy::approx_constant -A clippy::cloned_ref_to_slice_refs -A clippy::len_zero -A clippy::err_expect -A clippy::field_reassign_with_default" }
rust-test = { cmd = "cargo test --manifest-path rust/Cargo.toml --workspace", env = { DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib:/usr/lib", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } }
rust-coverage-check = { cmd = "rust/scripts/run_coverage.sh --fail-under-lines 91", env = { DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib:/usr/lib", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" } }
rust-license-audit = { cmd = "rust/scripts/audit_rust_licenses.py" }
rust-unsafe-audit = { cmd = "python3 rust/scripts/audit_rust_unsafe.py" }
rust-capi-header-audit = { cmd = "python3 rust/scripts/audit_capi_header.py" }
rust-cpp-port-audit = { cmd = "python3 rust/scripts/audit_cpp_port_backlog.py --include-plugins --top 40" }
rust-cpp-test-parity = { cmd = "python3 rust/scripts/audit_cpp_test_parity.py --build-dir .build", depends-on = ["build"] }
rust-capi-install-smoke = { cmd = "rust/scripts/check_installed_capi_consumer.sh .build", depends-on = ["build"] }
rust-source-package-smoke = { cmd = "cd .build && ninja package_source >/dev/null && cd .. && rust/scripts/check_source_package.sh .build", depends-on = ["build"] }
rust-guard = { depends-on = ["rust-fmt", "rust-check", "rust-clippy", "rust-test", "rust-coverage-check", "rust-license-audit", "rust-unsafe-audit", "rust-capi-header-audit"] }
rust-release-gate = { depends-on = ["rust-guard", "rust-cpp-port-audit", "rust-cpp-test-parity", "rust-capi-install-smoke", "rust-source-package-smoke"] }
rust-coverage = { cmd = "rust/scripts/run_coverage.sh" }
rust-mutants = { cmd = "rust/scripts/run_mutants.sh --workspace" }
rust-bench = { cmd = "python3 rust/scripts/benchmark_cpp_vs_rust.py --rust .build/bin/pdal", depends-on = ["build"] }
rust-bench-memory = { cmd = "python3 rust/scripts/benchmark_memory_cpp_vs_rust.py --rust .build/bin/pdal", depends-on = ["build"] }

[feature.doc.tasks]
configure = { cmd = [ "cmake",
    "-S", ".",
    "-B", "_build" ], cwd = "doc" }
doxygen = { cmd = "cmake --build . --target doxygen", depends-on = ["configure"], cwd = "doc/_build" }
build = { cmd = "cmake --build . --target html", depends-on = ["configure"], cwd = "doc/_build" }

[feature.doc.target.win-64.tasks]
preview = { cmd = "cmd /c start index.html", depends-on = ["build"], cwd = "doc/_build/html" }

[feature.doc.target.linux-64.tasks]
preview = { cmd = "xdg-open index.html", depends-on = ["build"], cwd = "doc/_build/html" }

[feature.doc.target.osx-64.tasks]
preview = { cmd = "open index.html", depends-on = ["build"], cwd = "doc/_build/html" }

[feature.doc.target.osx-arm64.tasks]
preview = { cmd = "open index.html", depends-on = ["build"], cwd = "doc/_build/html" }

[environments]
dev = ["dev"]
goldendoodle = ["goldendoodle"]
doc = ["doc"]
