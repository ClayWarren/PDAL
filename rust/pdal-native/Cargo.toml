[package]
name = "pdal-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native library adapters for the PDAL Rust port."

[features]
default = ["nitf"]
nitf = []

[dependencies]
gdal-sys = { version = "0.12", features = ["bindgen"] }
geos = { version = "11.1", features = ["v3_10_0", "json"] }
proj = "0.31"
proj-sys = "0.27"
serde_json = "1"

[target.'cfg(target_env = "msvc")'.dependencies]
link-cplusplus = { version = "1.0.12", features = ["nothing"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3"
