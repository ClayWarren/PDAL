[package]
name = "pdal-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-party readers and writers for the PDAL Rust port."

[dependencies]
byteorder = "1.5.0"
las = { version = "0.9.11", features = ["laz"] }
pdal-core = { path = "../pdal-core" }
roxmltree = "0.21.1"
serde_json = "1.0"

[dev-dependencies]
pdal-filters = { path = "../pdal-filters" }
tempfile = "3.27.0"
