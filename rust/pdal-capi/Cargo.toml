[package]
name = "pdal-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI for PDAL Rust port spike."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["nitf"]
nitf = ["pdal-io/nitf", "pdal-native/nitf"]

[dependencies]
chrono = "0.4.44"
pdal-core = { path = "../pdal-core" }
pdal-filters = { path = "../pdal-filters" }
pdal-io = { path = "../pdal-io", default-features = false }
pdal-kernels = { path = "../pdal-kernels" }
pdal-native = { path = "../pdal-native", default-features = false }
pdal-plugins = { path = "../pdal-plugins" }
serde_json = "1"
glob = "0.3"
xz2 = "0.1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.27.0"
