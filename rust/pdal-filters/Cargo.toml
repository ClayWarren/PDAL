[package]
name = "pdal-filters"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of PDAL filters."

[dependencies]
delaunator = "1"
h3o = "0.9"
pdal-core = { path = "../pdal-core" }
pdal-native = { path = "../pdal-native", default-features = false }
png = "0.17"
rstar = "0.12"
serde_json = "1"

[dev-dependencies]
pdal-io = { path = "../pdal-io", default-features = false }
tempfile = "3.27.0"
